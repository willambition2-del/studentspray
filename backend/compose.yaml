services:
  postgres:
    image: postgres:17-alpine
    container_name: quran_forum_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: quran_forum
      POSTGRES_USER: quran_forum
      POSTGRES_PASSWORD: quran_forum_dev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - quran_forum_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quran_forum -d quran_forum"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: quran_forum_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - quran_forum_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  quran_forum_postgres_data:
  quran_forum_redis_data:
