name: quran_forum
description: "Quran Forum Multi-Role Flutter App - Teacher Experience"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & Routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Networking & Storage
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.1.1

  # Local DB & Persistence
  drift: ^2.24.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8
  socket_io_client: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.24.1
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
